# 生产环境配置
# 使用方法: docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: mysql:8.0
    container_name: emby-movies-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: douban_top250
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql
    secrets:
      - db_password
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emby-movies-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: douban_top250
      EMBY_SERVER: ${EMBY_SERVER}
      EMBY_API_KEY: ${EMBY_API_KEY}
      EMBY_PARENT_ID: ${EMBY_PARENT_ID}
    volumes:
      - app-data:/app/data
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  mysql-data:
    driver: local
  app-data:
    driver: local
